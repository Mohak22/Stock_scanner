name: Stock Scanner Scheduler

on:
  workflow_dispatch:

jobs:
  run-scanner:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout STOCK_SCANNER
        uses: actions/checkout@v4

      - name: Checkout STOCK_SCANNER_DATA
        uses: actions/checkout@v4
        with:
          repository: Mohak22/STOCK_SCANNER_DATA
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: STOCK_SCANNER_DATA

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas pydantic numpy openpyxl

      - name: Run Stock Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |
          python orchestrator_main.py

      - name: Push strategy outputs

        run: |

          cd STOCK_SCANNER_DATA

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update scanner outputs" || echo "No changes to commit"

          git push

