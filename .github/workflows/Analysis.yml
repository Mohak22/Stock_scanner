name: Stock Scanner Analysis

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout STOCK_SCANNER
        uses: actions/checkout@v4

      - name: Checkout STOCK_SCANNER_DATA
        uses: actions/checkout@v4
        with:
          repository: Mohak22/STOCK_SCANNER_DATA
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: STOCK_SCANNER_DATA

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas yfinance openpyxl

      - name: Run Analysis Pipeline
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python analysis/main.py

      - name: Push Analysis Outputs
        run: |
          cd STOCK_SCANNER_DATA
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update analysis outputs" || echo "No changes to commit"
          git push
