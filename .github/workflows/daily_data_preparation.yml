name: Daily Data Preparation

on:

  # ============================================================
  # SCHEDULE
  #
  # 6:00 AM IST = 00:30 UTC
  #
  # Tuesday -> Saturday
  #
  # Tuesday    : Monday's completed data
  # Wednesday  : Tuesday's completed data
  # Thursday   : Wednesday's completed data
  # Friday     : Thursday's completed data
  # Saturday   : Friday's completed data
  #
  # Sunday/Monday : NO RUN
  # ============================================================

  schedule:
    - cron: "30 0 * * 2-6"

  # ============================================================
  # MANUAL TESTING
  # ============================================================

  workflow_dispatch:


# ==================================================================
# JOBS
# ==================================================================

jobs:

  prepare-daily-data:

    runs-on: ubuntu-latest

    # ==============================================================
    # PERMISSIONS
    # ==============================================================

    permissions:
      contents: read


    steps:

      # ============================================================
      # STEP 1
      # CHECKOUT STOCK_SCANNER
      # ============================================================

      - name: Checkout STOCK_SCANNER

        uses: actions/checkout@v4


      # ============================================================
      # STEP 2
      # CHECKOUT STOCK_SCANNER_DATA
      #
      # IMPORTANT:
      #
      # ../STOCK_SCANNER_DATA makes the two repositories siblings:
      #
      # /home/runner/work/Stock_scanner/
      #
      # ├── Stock_scanner/
      # │
      # └── STOCK_SCANNER_DATA/
      #
      # This matches the existing config.paths architecture.
      # ============================================================

      - name: Checkout STOCK_SCANNER_DATA

        uses: actions/checkout@v4

        with:

          repository: Mohak22/STOCK_SCANNER_DATA

          token: ${{ secrets.DATA_REPO_TOKEN }}

          path: ../STOCK_SCANNER_DATA


      # ============================================================
      # STEP 3
      # SET UP PYTHON
      # ============================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ============================================================
      # STEP 4
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            yfinance \
            pandas \
            numpy \
            pydantic \
            openpyxl \
            pyarrow \
            requests


      # ============================================================
      # STEP 5
      # VERIFY REPOSITORY STRUCTURE
      #
      # Temporary but useful while validating the workflow.
      # We can remove this later.
      # ============================================================

      - name: Verify repository structure

        run: |

          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"

          pwd

          echo ""

          echo "========================================"
          echo "STOCK_SCANNER"
          echo "========================================"

          ls -la

          echo ""

          echo "========================================"
          echo "STOCK_SCANNER_DATA"
          echo "========================================"

          ls -la ../STOCK_SCANNER_DATA

          echo ""

          echo "========================================"
          echo "MASTER UNIVERSE"
          echo "========================================"

          if [ -f ../STOCK_SCANNER_DATA/master_universe.csv ]; then
              echo "master_universe.csv EXISTS"
          else
              echo "master_universe.csv DOES NOT EXIST"
          fi


      # ============================================================
      # STEP 6
      # RUN DAILY DATA PREPARATION
      #
      # PYTHONPATH makes the STOCK_SCANNER repository root
      # available for imports such as:
      #
      # from fetch...
      # from processing...
      # from research...
      # from config...
      # ============================================================

      - name: Run Daily Data Preparation

        env:

          PYTHONPATH: ${{ github.workspace }}

        run: |

          python -m processing.daily_data_processing


      # ============================================================
      # STEP 7
      # SHOW DATA REPOSITORY CHANGES
      #
      # Useful during initial testing.
      # ============================================================

      - name: Check data repository changes

        run: |

          cd ../STOCK_SCANNER_DATA

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status

          echo ""

          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short


      # ============================================================
      # STEP 8
      # COMMIT AND PUSH UPDATED DATA
      # ============================================================

      - name: Push updated data

        run: |

          cd ../STOCK_SCANNER_DATA

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add .

          git commit \
            -m "Update daily research data" \
            || echo "No changes to commit"

          git push