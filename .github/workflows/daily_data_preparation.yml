name: Daily Data Preparation

on:

  # ============================================================
  # SCHEDULE
  #
  # 6:00 AM IST = 00:30 UTC
  #
  # Tuesday -> Saturday
  #
  # Tuesday    : Monday's completed data
  # Wednesday  : Tuesday's completed data
  # Thursday   : Wednesday's completed data
  # Friday     : Thursday's completed data
  # Saturday   : Friday's completed data
  #
  # Sunday / Monday : NO RUN
  # ============================================================

  schedule:
    - cron: "30 0 * * 2-6"

  # ============================================================
  # MANUAL TESTING
  # ============================================================

  workflow_dispatch:


# ==================================================================
# JOB
# ==================================================================

jobs:

  prepare-daily-data:

    runs-on: ubuntu-latest

    # ==============================================================
    # PERMISSIONS
    # ==============================================================

    permissions:
      contents: read


    steps:

      # ============================================================
      # STEP 1
      # CHECKOUT STOCK_SCANNER
      # ============================================================

      - name: Checkout STOCK_SCANNER

        uses: actions/checkout@v4


      # ============================================================
      # STEP 2
      # CHECKOUT STOCK_SCANNER_DATA
      #
      # IMPORTANT:
      #
      # The data repository is intentionally checked out INSIDE
      # STOCK_SCANNER because GitHub Actions does not allow checkout
      # outside the workspace.
      #
      # Result:
      #
      # Stock_scanner/
      #
      # ├── processing/
      # ├── fetch/
      # ├── research/
      # ├── config/
      # └── STOCK_SCANNER_DATA/
      #
      # config/paths.py must therefore use:
      #
      # PROJECT_ROOT / "STOCK_SCANNER_DATA"
      # ============================================================

      - name: Checkout STOCK_SCANNER_DATA

        uses: actions/checkout@v4

        with:

          repository: Mohak22/STOCK_SCANNER_DATA

          token: ${{ secrets.DATA_REPO_TOKEN }}

          path: STOCK_SCANNER_DATA


      # ============================================================
      # STEP 3
      # SET UP PYTHON
      # ============================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ============================================================
      # STEP 4
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            yfinance \
            pandas \
            numpy \
            pydantic \
            openpyxl \
            pyarrow \
            requests


      # ============================================================
      # STEP 5
      # VERIFY REPOSITORY STRUCTURE
      #
      # Keep this for the first successful test.
      # It can be removed later.
      # ============================================================

      - name: Verify repository structure

        run: |

          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"

          pwd

          echo ""

          echo "========================================"
          echo "STOCK_SCANNER"
          echo "========================================"

          ls -la

          echo ""

          echo "========================================"
          echo "STOCK_SCANNER_DATA"
          echo "========================================"

          ls -la STOCK_SCANNER_DATA

          echo ""

          echo "========================================"
          echo "MASTER UNIVERSE"
          echo "========================================"

          if [ -f STOCK_SCANNER_DATA/master_universe.csv ]; then
              echo "master_universe.csv EXISTS"
          else
              echo "master_universe.csv DOES NOT EXIST"
          fi

      # ============================================================
      # STEP 6
      # VERIFY DATA PATHS + RUN DAILY DATA PREPARATION
      # ============================================================

      - name: Verify data paths

        env:
          PYTHONPATH: ${{ github.workspace }}

        run: |

          echo "========================================"
          echo "GITHUB WORKSPACE"
          echo "========================================"

          echo "$GITHUB_WORKSPACE"

          echo ""

          echo "========================================"
          echo "DIRECTORIES"
          echo "========================================"

          pwd

          find . -maxdepth 3 -type d | sort

          echo ""

          echo "========================================"
          echo "STOCK_SCANNER_DATA"
          echo "========================================"

          ls -lah STOCK_SCANNER_DATA || true

          echo ""

          echo "========================================"
          echo "PROCESSED"
          echo "========================================"

          ls -lah STOCK_SCANNER_DATA/processed || true

          echo ""

          echo "========================================"
          echo "CONFIG PATH RESOLUTION"
          echo "========================================"

          python -c "
          from config.paths import (
              PROJECT_ROOT,
              GITHUB_DATA_REPOSITORY,
              LOCAL_DATA_REPOSITORY,
              DATA_REPOSITORY,
              RAW_BHAVCOPY_DIRECTORY,
              PROCESSED_BHAVCOPY_DIRECTORY
          )

          print('PROJECT_ROOT              =', PROJECT_ROOT)
          print('GITHUB_DATA_REPOSITORY    =', GITHUB_DATA_REPOSITORY)
          print('LOCAL_DATA_REPOSITORY     =', LOCAL_DATA_REPOSITORY)
          print('DATA_REPOSITORY           =', DATA_REPOSITORY)
          print('RAW_BHAVCOPY_DIRECTORY    =', RAW_BHAVCOPY_DIRECTORY)
          print('PROCESSED_BHAVCOPY        =', PROCESSED_BHAVCOPY_DIRECTORY)
          print('DATA_REPOSITORY EXISTS    =', DATA_REPOSITORY.exists())
          print('PROCESSED EXISTS          =', PROCESSED_BHAVCOPY_DIRECTORY.parent.exists())
          "

      - name: Run Daily Data Preparation

        env:
          PYTHONPATH: ${{ github.workspace }}

        run: |

          python -m processing.daily_data_processing
      # ============================================================
      # STEP 7
      # CHECK DATA REPOSITORY CHANGES
      # ============================================================

      - name: Check data repository changes

        run: |

          cd STOCK_SCANNER_DATA

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status

          echo ""

          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short


      # ============================================================
      # STEP 8
      # COMMIT AND PUSH UPDATED DATA
      # ============================================================

      - name: Push updated data

        run: |

          cd STOCK_SCANNER_DATA

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add .

          git commit \
            -m "Update daily research data" \
            || echo "No changes to commit"

          git push